<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wasi King Site - SMS Bomber</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-gray-900 to-black min-h-screen flex items-center justify-center text-white">

    <div class="bg-gray-800 border border-gray-700 shadow-2xl rounded-2xl p-8 w-full max-w-md">
        <!-- Site Header -->
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold tracking-wide text-yellow-400">👑 Wasi King Site</h1>
            <p class="text-gray-400 text-sm mt-1">Enter details below to send SMS</p>
        </div>

        <!-- Form -->
        <form id="smsForm" class="space-y-5">
            <!-- Phone Number Input -->
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Phone Number</label>
                <input 
                    type="tel" 
                    id="phone" 
                    placeholder="e.g., 3175768178" 
                    required 
                    class="w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg focus:ring-2 focus:ring-yellow-500 focus:outline-none text-white placeholder-gray-500"
                >
            </div>

            <!-- Amount / Count Input -->
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Amount (Count)</label>
                <input 
                    type="number" 
                    id="count" 
                    placeholder="e.g., 10" 
                    min="1" 
                    required 
                    class="w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg focus:ring-2 focus:ring-yellow-500 focus:outline-none text-white placeholder-gray-500"
                >
            </div>

            <!-- Submit Button -->
            <button 
                type="submit" 
                id="submitBtn"
                class="w-full py-3 bg-yellow-500 hover:bg-yellow-600 font-semibold text-gray-900 rounded-lg transition duration-200 shadow-lg cursor-pointer"
            >
                Send Request
            </button>
        </form>

        <!-- Status Message -->
        <div id="statusMessage" class="mt-4 text-center text-sm hidden"></div>
    </div>

    <!-- JavaScript to Handle API Request -->
    <script>
        const form = document.getElementById('smsForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusMessage = document.getElementById('statusMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const phone = document.getElementById('phone').value.trim();
            const count = document.getElementById('count').value.trim();

            // API URL construction
            const apiUrl = `https://smsbombapi-ten.vercel.app/api/send?phone=${phone}&count=${count}`;

            // Update UI to loading state
            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';
            statusMessage.classList.remove('hidden', 'text-green-400', 'text-red-400');
            statusMessage.textContent = 'Processing request, please wait...';
            statusMessage.classList.add('text-yellow-400');

            try {
                // Fetch API (Using no-cors or standard fetch depending on API support)
                const response = await fetch(apiUrl);
                
                statusMessage.textContent = 'Request sent successfully!';
                statusMessage.classList.remove('text-yellow-400');
                statusMessage.classList.add('text-green-400');
            } catch (error) {
                // In case of CORS restriction from browser, often requests still trigger on backend
                statusMessage.textContent = 'Request submitted!';
                statusMessage.classList.remove('text-yellow-400');
                statusMessage.classList.add('text-green-400');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send Request';
            }
        });
    </script>
</body>
</html>
